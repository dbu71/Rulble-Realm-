<style>
/* Look: a handheld console. Dark UI, neon-blue left grip and neon-red right grip, pixel fighters on static arenas. */
:root{
  color-scheme: dark;
  --bg:#141418;
  --panel:#23232b;
  --panel2:#2d2d37;
  --line:#3b3b48;
  --ink:#f3f3f7;
  --dim:#9a9aae;
  --blue:#0ab9e6;
  --blue2:#0888ad;
  --red:#ff4554;
  --red2:#cf2c3b;
  --gold:#ffd23f;
  --font:'Silkscreen','Courier New',monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated}

#app{height:100%;max-width:820px;margin:0 auto;position:relative;
  padding-left:max(14px, env(safe-area-inset-left, 0px));padding-right:max(14px, env(safe-area-inset-right, 0px))}

/* ---------- character select ---------- */
#sel{position:absolute;inset:0;display:flex;flex-direction:column;padding:10px max(14px, env(safe-area-inset-right,0px)) 0 max(14px, env(safe-area-inset-left,0px));overflow:hidden}
#sel::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,var(--blue) 0 50%,var(--red) 50% 100%)}
.hdr{display:flex;justify-content:space-between;align-items:baseline;padding:8px 2px 8px}
.hdr h1{margin:0;font-size:15px;letter-spacing:.08em;font-weight:700}
.hdr small{font-size:9px;color:var(--dim)}
#selBody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;overflow:auto;padding-bottom:10px;-webkit-overflow-scrolling:touch}
#prev{display:flex;gap:14px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:12px 14px;flex:0 0 auto}
#prevCv{width:96px;height:106px;flex:0 0 auto;background:radial-gradient(circle at 50% 70%,#3a3a4c,#202029);border-radius:14px}
#prevInfo{flex:1;min-width:0}
#pName{font-size:17px;font-weight:700;letter-spacing:.04em}
#pTag{font-size:9px;color:var(--dim);margin:3px 0 7px;line-height:1.4}
#pSp{font-size:9px;color:var(--gold);margin-bottom:8px}
.bar{display:grid;grid-template-columns:34px 1fr;align-items:center;gap:6px;font-size:8px;color:var(--dim);margin:3px 0}
.bar i{display:block;height:6px;border-radius:3px;background:#101015;overflow:hidden}
.bar b{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--blue),#7be8ff)}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;flex:0 0 auto}
.card{position:relative;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:6px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px}
.card canvas{width:44px;height:48px}
.card span{font-size:8px;letter-spacing:.03em;color:var(--dim)}
.card[aria-pressed="true"]{border-color:var(--blue);box-shadow:0 0 0 2px rgba(10,185,230,.35),0 0 14px rgba(10,185,230,.45);background:var(--panel2)}
.card[aria-pressed="true"] span{color:var(--ink)}
#selBar{flex:0 0 auto;display:flex;gap:10px;align-items:center;padding:10px 0 max(12px, env(safe-area-inset-bottom,0px));border-top:2px solid var(--line);background:var(--bg)}
.seg{display:flex;background:var(--panel);border:2px solid var(--line);border-radius:999px;overflow:hidden;flex:1}
.seg button{flex:1;padding:11px 2px;font-size:9px;color:var(--dim);letter-spacing:.04em}
.seg button[aria-pressed="true"]{background:var(--blue);color:#06232c;font-weight:700}
#fightBtn{flex:0 0 auto;padding:13px 22px;border-radius:999px;background:var(--red);color:#fff;font-size:14px;font-weight:700;letter-spacing:.08em;box-shadow:0 4px 0 var(--red2)}
#fightBtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--red2)}

#lvlWrap{flex:0 0 auto;padding:8px 0 2px}
#lvlName{display:none;font-size:9px;color:var(--dim);letter-spacing:.06em;margin-bottom:6px}
#lvlRow{display:flex;gap:6px}
#lvlRow button{flex:1;padding:9px 0;border-radius:10px;background:var(--panel);border:2px solid var(--line);font-size:11px;font-weight:700;color:var(--ink)}
#lvlRow button[aria-pressed="true"]{border-color:var(--red);background:#3a2026;box-shadow:0 0 10px rgba(255,69,84,.4)}
#lvlRow button:disabled{opacity:.35;cursor:default}
/* ---------- fight scene ---------- */
#fight{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:12px;
  padding:6px max(14px, env(safe-area-inset-right,0px)) max(10px, env(safe-area-inset-bottom,0px)) max(14px, env(safe-area-inset-left,0px))}
#view{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;
  border:5px solid #08080c;outline:3px solid var(--line);box-shadow:0 0 0 7px #1e1e26,0 10px 24px rgba(0,0,0,.55)}
#game{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.ovl{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:10px;background:rgba(10,10,16,.72);text-align:center;padding:10px}
.ovl h2{margin:0;font-size:clamp(16px,5vw,26px);letter-spacing:.06em}
.ovl p{margin:0;font-size:9px;color:var(--dim)}
.ovl .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{padding:11px 16px;border-radius:999px;background:var(--panel2);border:2px solid var(--line);font-size:10px;font-weight:700;letter-spacing:.06em}
.btn.main{background:var(--blue);border-color:var(--blue);color:#06232c}
#pads{display:grid;grid-template-columns:1fr 1fr;gap:10px;touch-action:none}
.jc{position:relative;height:176px;touch-action:none}
#jcL{background:linear-gradient(160deg,#27d3fb,#0a95bd);border-radius:50px 14px 14px 50px;box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 5px 0 #066e8a}
#jcR{background:linear-gradient(200deg,#ff6572,#d02f3e);border-radius:14px 50px 50px 14px;box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 5px 0 #9d1f2c}
.mini{position:absolute;top:12px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;font-size:15px;font-weight:700;display:grid;place-items:center;line-height:1}
#jcL .mini{right:18px}
#jcR .mini{left:18px}
.mini[aria-pressed="false"]{opacity:.55}
#stick{position:absolute;left:50%;top:60%;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;background:radial-gradient(circle,#26262e 55%,#14141a);box-shadow:inset 0 0 0 4px #0b0b10,0 3px 0 rgba(0,0,0,.35);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#6a6a7a,#34343f);box-shadow:0 3px 0 rgba(0,0,0,.45)}
#diam{position:absolute;left:50%;top:60%;width:140px;height:140px;margin:-70px 0 0 -70px}
.pad{position:absolute;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#3a3a46,#1d1d24);color:#f6f6fa;display:grid;place-content:center;justify-items:center;gap:1px;box-shadow:0 4px 0 rgba(0,0,0,.45);touch-action:none}
.pad b{font-size:17px;line-height:1}
.pad small{font-size:6px;letter-spacing:.04em;color:#b8b8c8}
.pad.down{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.45);background:radial-gradient(circle at 40% 30%,#555566,#2a2a34)}
#bX{left:43px;top:0}#bY{left:0;top:43px}#bA{right:0;top:43px}#bB{left:43px;bottom:0}

@media (orientation:landscape) and (max-height:560px){
  #fight{display:grid;grid-template-columns:150px minmax(0,1fr) 150px;gap:10px;align-items:center;padding:8px max(14px, env(safe-area-inset-right,0px)) 8px max(14px, env(safe-area-inset-left,0px))}
  #app{max-width:none}
  #view{justify-self:center;align-self:center;width:100%;height:auto;max-height:calc(100vh - 16px)}
  #pads{display:contents}
  .jc{height:min(100%,300px)}
  #jcL{grid-column:1;grid-row:1}
  #view{grid-column:2;grid-row:1}
  #jcR{grid-column:3;grid-row:1}
  #stick{width:92px;height:92px;margin:-46px 0 0 -46px;top:58%}
  #diam{transform:scale(.9);top:58%}
  #sel #selBody{display:grid;grid-template-columns:1fr 1.5fr;align-items:start}
  #grid{grid-template-columns:repeat(4,1fr)}
}
@media (prefers-reduced-motion: reduce){ .pad{transition:none} }
</style>

<div id="app">
  <section id="sel" aria-label="Choose your fighter">
    <div class="hdr"><h1>PICK YOUR FIGHTER</h1><small id="rec"></small></div>

      </div>

  </section>
</div>

<script>
(function(){
'use strict';

const VW=320, VH=180, STEP=1/60;
const LY0=114, LY1=170, LEN=1760;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sgn=v=>v>0?1:v<0?-1:0;
function mul(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16); let r=n>>16&255,g=n>>8&255,b=n&255;
  const f=v=>Math.round(clamp(amt>=0?v+(255-v)*amt:v*(1+amt),0,255));
  return 'rgb('+f(r)+','+f(g)+','+f(b)+')';
}

/* ---------- save ---------- */
const KEY='rumble-realm-save-v3';
const save={fighter:0,diff:1,mode:0,wins:0,losses:0};
try{ const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s&&typeof s==='object'){
  ['fighter','diff','mode','wins','losses'].forEach(k=>{ if(Number.isFinite(s[k])) save[k]=Math.floor(s[k]); });
} }catch(e){}
function persist(){ try{ localStorage.setItem(KEY,JSON.stringify(save)); }catch(e){} }


/* ---------- audio ---------- */
let AC=null, master=null, muted=false, nbuf=null;
function unlock(){
  try{
    if(!AC){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return; AC=new C(); master=AC.createGain(); master.gain.value=.5; master.connect(AC.destination);
      nbuf=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate); const d=nbuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
    if(AC.state==='suspended') AC.resume();
    try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
  }catch(e){}
}
function tone(f,d,type,v,slide){
  if(!AC||muted) return;
  const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);
  g.gain.setValueAtTime(v||.12,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+d+.03);
}
function noise(d,v){
  if(!AC||muted||!nbuf) return;
  const t=AC.currentTime, s=AC.createBufferSource(), g=AC.createGain(), f=AC.createBiquadFilter();
  s.buffer=nbuf; f.type='lowpass'; f.frequency.value=2400;
  g.gain.setValueAtTime(v||.2,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t+d+.02);
}
const SFX={
  hit(p){ noise(.07,.22); tone(200+Math.min(p,40)*6,.09,'square',.14,.5); },
  big(){ noise(.22,.38); tone(110,.26,'sawtooth',.22,.35); },
  jump(){ tone(300,.12,'square',.07,2); },
  swing(){ tone(520,.06,'triangle',.05,.6); },
  shoot(){ tone(760,.14,'square',.07,.4); },
  guard(){ tone(260,.08,'triangle',.1); },
  ko(){ tone(420,.55,'sawtooth',.16,.2); noise(.4,.28); },
  pick(){ tone(660,.07,'square',.08); },
  tick(){ tone(900,.03,'square',.05); },
  tele(){ tone(980,.14,'sine',.1,.3); tone(260,.12,'triangle',.06,2); },
  go(){ tone(520,.1,'square',.1); setTimeout(()=>tone(780,.22,'square',.1),90); },
  win(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.2,'square',.1),i*110)); },
  lose(){ [392,330,262].forEach((f,i)=>setTimeout(()=>tone(f,.25,'triangle',.12),i*150)); }
};


/* ---------- fighters (all original) ---------- */
const FIGHTERS=[
  {name:'CINDER',  tag:'An ember imp who never stops sprinting.',   sp:'B: Flame Dash',   kind:'dash',   trait:'horns',   spd:1.95,jump:5.2,wt:.9, pow:1.15,c:{skin:'#ff7a45',body:'#3a2230',acc:'#ffd23f',dark:'#2a1620'}},
  {name:'HOOT',    tag:'A frosty owl that snipes from afar.',       sp:'B: Ice Lance',    kind:'beam',   trait:'tufts',   spd:1.6, jump:5.6,wt:.8, pow:.95, c:{skin:'#d4ebff',body:'#5a7bd6',acc:'#ffe28a',dark:'#33458a'}},
  {name:'MOSSIMO', tag:'A heavy moss golem that hits like a truck.',sp:'B: Moss Quake',   kind:'slam',   trait:'crest',   spd:1.2, jump:4.8,wt:1.35,pow:1.3, c:{skin:'#7fa05d',body:'#5b4636',acc:'#c8e87a',dark:'#3b2d22'}},
  {name:'RIPPLE',  tag:'A tide newt who rides big waves.',          sp:'B: Tide Wave',    kind:'wave',   trait:'fins',    spd:1.8, jump:5.0,wt:1.0, pow:1.0, c:{skin:'#3fd0c9',body:'#1f6fa8',acc:'#ffffff',dark:'#154a73'}},
  {name:'TICK',    tag:'A clockwork knight with a gear-burst.',     sp:'B: Gear Burst',   kind:'nova',   trait:'visor',   spd:1.4, jump:5.0,wt:1.2, pow:1.2, c:{skin:'#bcbad0',body:'#6b6a85',acc:'#ffcc33',dark:'#44435c'}},
  {name:'NIMBUS',  tag:'A cloud cat. Light, quick and showy.',      sp:'B: Cloud Barrage',kind:'barrage',trait:'cat',     spd:2.0, jump:5.7,wt:.75,pow:.9,  c:{skin:'#f1f1ff',body:'#8fa4ff',acc:'#ff9ad0',dark:'#5666b8'}},
  {name:'FERN',    tag:'A sprout sprite who fans out seed shots.',  sp:'B: Seed Fan',     kind:'spread', trait:'antenna', spd:1.7, jump:5.3,wt:.85,pow:.9,  c:{skin:'#a6e86b',body:'#2f8a4a',acc:'#ff6fa5',dark:'#1e5c30'}},
  {name:'DUSK',    tag:'A shadow hare. Blink and you miss her.',    sp:'B: Shade Rush',   kind:'dash',   trait:'longears',spd:2.1, jump:5.3,wt:.8, pow:1.05,c:{skin:'#6a5a8c',body:'#231a3a',acc:'#ff5fd2',dark:'#140e24'}},
  {name:'SPORE',   tag:'A mushroom monk who lobs spore bombs.',    sp:'B: Spore Bomb',   kind:'bomb',   trait:'hat',     spd:1.3, jump:4.9,wt:1.1, pow:1.05,c:{skin:'#f4d9b0',body:'#c94a4a',acc:'#ffffff',dark:'#8a2e2e'}},
  {name:'VOLT',    tag:'A thunder pup, fast and sparky.',           sp:'B: Zap Spin',     kind:'spin',   trait:'tail',    spd:2.2, jump:5.2,wt:.85,pow:1.0, c:{skin:'#ffd93b',body:'#3b3b55',acc:'#fff7a0',dark:'#262638'}},
  {name:'GEODE',   tag:'A crystal crab king. Spins to win.',        sp:'B: Crystal Whirl',kind:'spin',   trait:'crown',   spd:1.3, jump:4.9,wt:1.3, pow:1.25,c:{skin:'#c58cff',body:'#5a3a9a',acc:'#8cf1ff',dark:'#3a2468'}},
  {name:'MARSH',   tag:'A puffy ghost who heals herself.',          sp:'B: Puff Heal',    kind:'heal',   trait:'hood',    spd:1.5, jump:5.5,wt:.7,  pow:.85, c:{skin:'#ffffff',body:'#ffc6e2',acc:'#ff7ab8',dark:'#d98fb6'}}
];
const SPCOST={heal:55};
const spCost=k=>SPCOST[k]||35;

/* ---------- levels (scrolling, each with its own scenery) ---------- */
const LEVELS=[
  {name:'SUNNY HILLTOP', theme:'meadow',boss:'BRAMBLE KING',seed:11,pal:{top:'#6bd46b',body:'#7a5a3a',dark:'#5a4029',trim:'#3f8f3f'},E:{skin:'#9ccf5a',body:'#6a4a2a',acc:'#ffe27a',dark:'#3d2a16'}},
  {name:'CRYSTAL CAVERN',theme:'cavern',boss:'GLOOM QUEEN', seed:22,pal:{top:'#7a6bd6',body:'#3a3466',dark:'#2a2450',trim:'#a99bff'},E:{skin:'#8a7cff',body:'#2c2552',acc:'#6fe3ff',dark:'#1a1535'}},
  {name:'NEON STREETS',  theme:'city',  boss:'NEON JACK',   seed:33,pal:{top:'#ff5fa2',body:'#2c2650',dark:'#201a3e',trim:'#00e0ff'},E:{skin:'#ff8ad0',body:'#2a2050',acc:'#00e0ff',dark:'#17112f'}},

const modz=z=>((z%NZ)+NZ)%NZ;
const ZP=new Map(), ZN=new Map();
function zonePlats(z){
  let r=ZP.get(z); if(r) return r;
  const L=LAY[modz(z)], ox=z*ZW;
  r={blocks:L.blocks.map(b=>({x1:ox+b.x1,x2:ox+b.x2,y:b.y,h:18,z:z})),soft:L.soft.map(s=>({x1:ox+s.x1,x2:ox+s.x2,y:s.y,z:z}))};
  ZP.set(z,r); return r;
}
function nearPlats(x){
  const k=Math.floor(x/ZW); let r=ZN.get(k); if(r) return r;
  const a=zonePlats(k-1), b=zonePlats(k), c=zonePlats(k+1);
  r={blocks:a.blocks.concat(b.blocks,c.blocks),soft:a.soft.concat(b.soft,c.soft)};
  if(ZN.size>60) ZN.clear(); ZN.set(k,r); return r;
}
function support(x,y){
  const P=nearPlats(x); let best=null;
  for(const b of P.blocks) if(x>b.x1-3&&x<b.x2+3&&b.y>=y-3&&(!best||b.y<best.y)) best=b;
  for(const s of P.soft) if(x>s.x1-3&&x<s.x2+3&&s.y>=y-3&&(!best||s.y<best.y)) best=s;
  return best;
}
function nearestBlock(x,y){
  const P=nearPlats(x); let best=null,bd=1e9;
  for(const b of P.blocks){ const cx=(b.x1+b.x2)/2, d=Math.abs(cx-x)+Math.abs(b.y-y)*.5; if(d<bd){ bd=d; best=b; } }
  return best;
}

const OUT='#1c1326';
function limb(g,x1,y1,x2,y2,w,col){

}
function rrect(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function fillS(g,fill,lw){ g.fillStyle=fill; g.fill(); g.lineWidth=lw||1.1; g.lineJoin='round'; g.strokeStyle=OUT; g.stroke(); }
function vgrad(g,y1,y2,c1,c2){ const gr=g.createLinearGradient(0,y1,0,y2); gr.addColorStop(0,c1); gr.addColorStop(1,c2); return gr; }

function poly(g,pts){ g.beginPath(); g.moveTo(pts[0],pts[1]); for(let i=2;i<pts.length;i+=2) g.lineTo(pts[i],pts[i+1]); g.closePath(); }

    else if(k==='down'||k==='airdown'){ aF=.15; aB=-.5; armL=9+p*4; lean=.2; }
    else if(k==='airn'||k==='spin'){ aF=1.45; aB=-1.45; armL=9+p*2; }

/* ---------- physics ---------- */
function collide(f){
  const P=nearPlats(f.x), hw=6, h=25, px=f.x, py=f.y;

    if(f.x+hw>b.x1&&f.x-hw<b.x2&&f.y>b.y&&f.y-h<b.y+b.h){

/* ---------- one fighter, one frame ---------- */
function stepFighter(f,inp){
  const d=f.def;
  if(f.dead){ f.respT--; if(f.respT<=0&&f.stocks>0) respawn(f); return; }
  if(f.inv>0) f.inv--; if(f.cd>0) f.cd--; if(f.cdC>0) f.cdC--; if(f.cdD>0) f.cdD--; if(f.dropT>0) f.dropT--;
  f.anim++;
  const canAct=F.state==='play';
  if(!canAct) inp={mx:0,my:0,pA:false,pS:false,pJ:false,pD:false,pC:false,up:false,noBuf:false};
  if(f.hitstun>0){ f.hitstun--; f.vx*=.992; f.rot+=f.vx*.03; }
  else {
    f.rot*=.7;
    switch(f.st){
      case 'free': {
        const mx=inp.mx, spd=d.spd;
        if(f.onGround){
          if(mx){ f.face=mx; if(mx>0&&f.vx<spd) f.vx=Math.min(spd,f.vx+.35); if(mx<0&&f.vx>-spd) f.vx=Math.max(-spd,f.vx-.35); }
          else f.vx*=.8;
          if(Math.abs(f.vx)<.05) f.vx=0;
        } else {
          if(mx>0&&f.vx<spd) f.vx=Math.min(spd,f.vx+.16); if(mx<0&&f.vx>-spd) f.vx=Math.max(-spd,f.vx-.16);
          if(!mx) f.vx*=.995;
        }
        if(f.onGround&&f.soft&&inp.my>0){ f.downT++; if(f.downT>6){ f.dropT=16; f.onGround=false; f.y+=1.5; f.downT=0; } } else f.downT=0;
        if(inp.pC&&f.cdC<=0){ f.st='counter'; f.t=0; f.vx*=.3; SFX.guard(); break; }
        if(inp.pD&&f.cdD<=0&&(f.onGround||!f.airDod)){ startDodge(f,inp); break; }
        if(inp.pJ){ if(!f.onGround||inp.noBuf) doJump(f); else f.jumpBuf=4; }
        if(f.jumpBuf>0){ if(inp.pA){ f.jumpBuf=0; startAtk(f,'up'); break; } f.jumpBuf--; if(f.jumpBuf===0) doJump(f); }
        if(inp.pS){
          if(inp.my<0&&!f.riseUsed){ startAtk(f,'rise'); break; }
          if(f.cd<=0){ if(mx) f.face=mx; startAtk(f,d.kind); break; }
        }
        if(inp.pA){
          if(f.weapon){ if(mx) f.face=mx; startAtk(f,WEAP[f.weapon.k].atk); break; }
          let k; const air=!f.onGround;
          if(!air) k=inp.my<0?'up':inp.my>0?'down':mx?'fwd':'jab'; else k=inp.my<0?'airup':inp.my>0?'airdown':mx?'airfwd':'airn';
          if(mx) f.face=mx; startAtk(f,k); break;
        }

      }
      case 'atk': {
        const a=f.atk; a.t++; const k=a.kind, A=ATK[k], t=a.t, pw=d.pow;
        if(t===a.st){
          if(k==='rise'){ f.vy=-6.4; f.riseUsed=true; f.onGround=false; }
          if(PROJ[k]) spawnProj(f,k,k==='beam'?{pierce:true}:k==='wave'?{pierce:true}:null);
          if(k==='bolt'){}
          if(k==='spread'){ [-.8,0,.8].forEach(vy=>spawnProj(f,'shot',{vy:vy,dm:1.1})); }
          if(k==='heal'){ f.pct=Math.max(0,f.pct-20); spark(f.x,f.y-14,16,'#9dffb0',1.8); ringFx(f.x,f.y-12,'#9dffb0'); SFX.win(); }
          if(k==='slam'&&!f.onGround) f.vy=7;
          if(k==='slam'&&f.onGround){ spark(f.x-12,f.y,5,'#ffffff',1.2); spark(f.x+12,f.y,5,'#ffffff',1.2); F.shake=Math.max(F.shake,2); }
          if(k==='nova'){ ringFx(f.x,f.y-12,f.def.c.acc); F.shake=Math.max(F.shake,3); SFX.big(); }
          if(a.w){ f.weapon.dur--; if(a.w==='staff') spawnProj(f,'bolt'); else if(a.w==='stars') spawnProj(f,'star'); }
        }
        if(k==='barrage'&&t>=a.st&&t<a.st+a.ac&&(t-a.st)%5===0) spawnProj(f,'shot',{dy:(rr()*10-5),vy:(rr()-.5)*.3,sp:1.5,dm:.9});
        const act=t>=a.st&&t<a.st+a.ac;

          if(k==='spin'&&!f.onGround) f.vy=Math.min(f.vy,.6);

/* ---------- CPU brain ---------- */
const AIC=[{rate:15,acc:.4,react:.18},{rate:9,acc:.65,react:.4},{rate:4,acc:.9,react:.65}];
function aiThink(f){

  if(f.dead) return;
  let o=null,bd=1e9; F.fs.forEach(q=>{ if(q!==f&&!q.dead){ const dd=Math.abs(q.x-f.x)+Math.abs(q.y-f.y)*1.2; if(dd<bd){ bd=dd; o=q; } } });

    const b=nearestBlock(f.x,f.y), cx=(b.x1+b.x2)/2; a.mx=sgn(cx-f.x);
    if(f.hitstun>0) return;
    if(f.vy>0&&f.jumps>0) a.pj=true;

    else if(!f.airDod&&f.vy>3&&f.y>b.y+20&&rr()<.25) a.pd=true;
    return;
  }
  if(!o||o.dead){ return; }
  const dx=o.x-f.x, dy=o.y-f.y, ad=Math.abs(dx);
  if(o.inv>0&&o.st!=='free'&&ad<80){ a.mx=0; return; }
  if(ad>22) a.mx=sgn(dx); else if(rr()<.3) a.mx=-sgn(dx);
  if(f.onGround){
    const nx=f.x+a.mx*18, ahead=support(nx,f.y-6);
    if(!ahead||ahead.y>f.y+8){
      if(f.jumps>0&&ad>30&&dy<60&&rr()<.8) a.pj=true; else if(dy<=40) a.mx=0;
    }
  }
  const near=ad<30&&Math.abs(dy)<34;
  if(near&&rr()<cfg.acc){ a.pa=true; if(dy<-22) a.my=-1; else if(dy>16&&!f.onGround) a.my=1; else if(f.onGround&&rr()<.45) a.mx=sgn(dx)||f.face; else if(rr()<.5) a.mx=0; }
  else if(ad>70&&f.cd<=0&&rr()<.3*cfg.acc&&['shot','beam','wave','bomb','spread','barrage'].indexOf(f.def.kind)>=0){ a.ps=true; a.mx=sgn(dx); }
  else if(ad<60&&f.cd<=0&&rr()<.13*cfg.acc&&['dash','spin','slam','nova','heal'].indexOf(f.def.kind)>=0){ a.ps=true; a.mx=sgn(dx); }
  if(dy<-28&&f.onGround&&rr()<.5) a.pj=true;
  if(!f.onGround&&dy<-22&&f.jumps>0&&f.vy>0&&rr()<.4) a.pj=true;
  if(f.onGround&&f.soft&&dy>34) a.my=1;
  if(o.st==='atk'&&ad<38&&Math.abs(dy)<30&&rr()<cfg.react){ if(f.cdC<=0&&rr()<.55) a.pc=true; else if(f.cdD<=0) a.pd=true; }
  const it=F.items.find(i=>Math.abs(i.x-f.x)<90&&Math.abs(i.y-f.y)<40);
  if(it&&(!f.weapon||it.k==='food')&&ad>50) a.mx=sgn(it.x-f.x);

function cpuInput(f){

function humanInput(){

/* ---------- flow ---------- */
function updateCamera(){
  const alive=F.fs.filter(f=>!f.dead), src=alive.length?alive:F.fs;
  const gs=alive.filter(f=>f.onGround&&f.hitstun<=0);
  if(gs.length){ F.refx=gs.reduce((s,f)=>s+f.x,0)/gs.length; F.refOk=true; } else F.refOk=false;
  let mn=1e9,mx=-1e9; src.forEach(f=>{ mn=Math.min(mn,f.x); mx=Math.max(mx,f.x); });
  const tx=(mn+mx)/2, span=clamp(mx-mn+150,300,520);
  F.cx+=(tx-F.cx)*.09; F.vw+=(span-F.vw)*.05;
}
function checkEnd(){
  if(F.state!=='play') return;
  const alive=F.fs.filter(f=>f.stocks>0);
  if(alive.length<=1||(F.fs[0].stocks<=0&&!F.auto)){ F.state='over'; F.endT=0; F.winner=alive.length?alive[0].i:-1; }
}
function update(){
  if(F.state==='sel'||F.paused) return;
  F.t++;
  for(let i=F.parts.length-1;i>=0;i--){ const q=F.parts[i]; q.x+=q.vx; q.y+=q.vy; if(!q.ring) q.vy+=.05; q.l--; if(q.l<=0) F.parts.splice(i,1); }
  if(F.shake>0) F.shake=Math.max(0,F.shake-.4);
  if(F.zp>0) F.zp=Math.max(0,F.zp-.03);
  if(F.cflash>0) F.cflash--;
  if(F.state==='over'){ F.endT++; if(F.endT===70) showResult(); updateCamera(); return; }
  if(F.lag>0){ F.lag--; if(F.lag===0&&F.cfx) fireCounter(); updateCamera(); return; }
  if(F.state==='intro'&&F.t>=110) F.state='play';
  F.fs.forEach(f=>{ const inp=(f.cpu)?cpuInput(f):humanInput(); stepFighter(f,inp); });
  updateProj(); updateItems(); updateCamera(); checkEnd();
}
function ordinal(n){ return n===1?'1ST':n===2?'2ND':n===3?'3RD':n+'TH'; }
function showResult(){
  const n=F.fs.length; let place=1;
  const idx=F.out.indexOf(0); if(idx>=0) place=n-idx;
  if(F.winner===0) place=1;
  const win=place===1;
  if(!F.auto){ if(win) save.wins++; else save.losses++; persist(); }
  if(F.mode===0) $('resT').textContent=win?'YOU WIN!':'YOU LOSE';
  else $('resT').textContent=win?'YOU WIN!':ordinal(place)+' PLACE';
  const fn=F.fs.map(f=>f.def.name).join(' / ');
  $('resS').textContent=(F.mode?'Free for all':'1 vs 1')+'  -  '+fn;
  $('resOv').hidden=false; if(win) SFX.win(); else SFX.lose();
  setTimeout(()=>{ try{ $('rematchBtn').focus({preventScroll:true}); }catch(e){} },50);
}

    else if(p.kind==='beam'){ ctx.save(); ctx.translate(p.x,p.y); ctx.fillStyle=p.col; rrect(ctx,-14,-2,28,4,2); ctx.fill(); ctx.fillStyle='#fff'; rrect(ctx,-9,-.9,18,1.8,1); ctx.fill(); ctx.restore(); }
    else if(p.kind==='bolt'){ ctx.fillStyle='#d28bff'; ctx.beginPath(); ctx.arc(p.x,p.y,4.4,0,6.283); ctx.fill(); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(p.x,p.y,2,0,6.283); ctx.fill(); }
    else if(p.kind==='star'){ ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(F.t*.5); poly(ctx,[0,-3.6,1,-1,3.6,0,1,1,0,3.6,-1,1,-3.6,0,-1,-1]); fillS(ctx,'#f4f4ff',.8); ctx.restore(); }
    else { ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x,p.y,3.4,0,6.283); ctx.fill(); ctx.strokeStyle=OUT; ctx.lineWidth=.9; ctx.stroke(); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(p.x-.7,p.y-.7,1.2,0,6.283); ctx.fill(); }
  });
  F.parts.forEach(q=>{
    ctx.globalAlpha=clamp(q.l/10,0,1);
    if(q.ring){ ctx.strokeStyle=q.c; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(q.x,q.y,(14-q.l)*3.4,0,6.283); ctx.stroke(); }
    else { ctx.fillStyle=q.c; ctx.beginPath(); ctx.arc(q.x,q.y,q.r,0,6.283); ctx.fill(); }
  }); ctx.globalAlpha=1;
  // screen-space layer
  ctx.setTransform(1,0,0,1,0,0);
  const u=W/320;
  // off-screen markers
  const vis=F.vw/2, vh=F.vw*.28;
  F.fs.forEach(f=>{
    if(f.dead) return;
    const px=(f.x-F.cx)*zz+W/2, py=(f.y-12-camY)*zz+H/2;
    if(px<0||px>W||py<0||py>H){
      const ex=clamp(px,12*u,W-12*u), ey=clamp(py,12*u,H-26*u);
      ctx.fillStyle=PC[f.i]; ctx.beginPath(); ctx.arc(ex,ey,7*u,0,6.283); ctx.fill(); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(ex,ey,3*u,0,6.283); ctx.fill();
    }
  });
  // counter freeze
  if(F.cflash>0&&F.cfx){
    ctx.fillStyle='rgba(8,8,24,'+(.35*Math.min(1,F.cflash/10))+')'; ctx.fillRect(0,0,W,H);
    const v=F.cfx.vic, px=(v.x-F.cx)*zz+W/2, py=(v.y-16-camY)*zz+H/2;
    ctx.strokeStyle='rgba(255,236,150,.9)'; ctx.lineWidth=2*u; ctx.beginPath(); ctx.arc(px,py,(40-F.cflash)*zz*.9,0,6.283); ctx.stroke();
    text('COUNTER!',W/2,H*.3,16*u,'#ffd23f','center','#0a0a10');
  }
  drawHUD(u);
  if(F.state==='intro'){ const t=F.t; text(t<70?'READY':'FIGHT!',W/2,H*.42,26*u,'#ffffff','center','#0a0a10'); if(t<80) text('FLICK UP JUMP  A HIT  B SPECIAL  X DODGE  Y COUNTER',W/2,H*.52,6*u,'#ffd23f','center','#0a0a10'); }
  else if(F.state==='play'&&F.t<150) text('GO!',W/2,H*.42,28*u,'#ffd23f','center','#0a0a10');
  if(F.state==='over') text('GAME!',W/2,H*.45,30*u,'#ff4554','center','#ffffff');
}
function drawHUD(u){
  const n=F.fs.length, pw=n===2?92*u:72*u, gap=n===2?8*u:5*u;
  const total=n*pw+(n-1)*gap, x0=(W-total)/2, y=H-30*u;
  F.fs.forEach((f,i)=>{
    const x=x0+i*(pw+gap);
    ctx.fillStyle='rgba(8,8,16,.72)'; rrect(ctx,x,y,pw,27*u,5*u); ctx.fill(); ctx.fillStyle=PC[f.i]; ctx.fillRect(x+3*u,y,pw-6*u,2*u);
    ctx.save(); ctx.beginPath(); ctx.rect(x,y,pw,27*u); ctx.clip(); ctx.translate(x+11*u,y+25*u); ctx.scale(.36*u,.36*u); drawChar(ctx,f.def,{face:1,t:0,an:f.stocks<=0?'hurt':'idle'}); ctx.restore();
    text(f.def.name,x+22*u,y+10*u,6*u,'#fff');
    text(f.stocks>0?Math.floor(f.pct)+'%':'OUT',x+pw-5*u,y+23*u,(n===2?13:11)*u,f.stocks>0?pctColor(f.pct):'#888','right','#0a0a10');
    for(let s=0;s<3;s++){ ctx.fillStyle=s<f.stocks?f.def.c.acc:'rgba(255,255,255,.18)'; ctx.beginPath(); ctx.arc(x+26*u+s*7*u,y+18*u,2.6*u,0,6.283); ctx.fill(); }
    if(f.weapon) text(f.weapon.k.toUpperCase()+' '+f.weapon.dur,x+22*u,y-3*u,5*u,'#ffffff','left','#0a0a10');
  });
}
function pctColor(p){ const t=clamp(p/150,0,1); return 'rgb(255,'+Math.round(255-t*180)+','+Math.round(255-t*220)+')'; }
function draw(){
  if(F.state==='sel') return;
  if(!cv.width||cv.width<20) resize();
  drawWorld();
}

/* ---------- input ---------- */
const stick=$('stick'), knob=$('knob'); let stickPtr=null;
function stickSet(e){
  const r=stick.getBoundingClientRect(); const cx=r.left+r.width/2, cy=r.top+r.height/2; let dx=e.clientX-cx, dy=e.clientY-cy;
  const R=r.width*.36, m=Math.hypot(dx,dy); if(m>R){ dx*=R/m; dy*=R/m; }
  knob.style.transform='translate('+dx+'px,'+dy+'px)';
  const nx=dx/R, ny=dy/R; tc.mx=nx>.35?1:nx<-.35?-1:0; tc.my=ny>.5?1:ny<-.5?-1:0;
}
function stickEnd(){ stickPtr=null; tc.mx=0; tc.my=0; knob.style.transform=''; }
stick.addEventListener('pointerdown',e=>{ unlock(); try{ stick.setPointerCapture(e.pointerId); }catch(err){} stickPtr=e.pointerId; stickSet(e); e.preventDefault(); });
stick.addEventListener('pointermove',e=>{ if(e.pointerId===stickPtr) stickSet(e); });
['pointerup','pointercancel','lostpointercapture'].forEach(t=>stick.addEventListener(t,e=>{ if(e.pointerId===stickPtr) stickEnd(); }));
function holdBtn(el,down){
  el.addEventListener('pointerdown',e=>{ unlock(); try{ el.setPointerCapture(e.pointerId); }catch(err){} el.classList.add('down'); down&&down(); e.preventDefault(); });
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>el.addEventListener(t,()=>{ el.classList.remove('down'); }));
}
holdBtn($('bA'),()=>{ press.a=true; });
holdBtn($('bB'),()=>{ press.s=true; });
holdBtn($('bX'),()=>{ press.d=true; });
holdBtn($('bY'),()=>{ press.c=true; });
window.addEventListener('keydown',e=>{
  const nav=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '];
  if(e.repeat){ if(nav.indexOf(e.key)>=0) e.preventDefault(); return; }
  const k=e.key.length===1?e.key.toLowerCase():e.key; keys[k]=true; unlock();
  if(F.state==='sel') return;
  if(k==='z'||k==='j') press.a=true; if(k==='x'||k==='k') press.s=true; if(k===' ') press.j=true; if(k==='c'||k==='Shift') press.d=true; if(k==='v') press.c=true;
  if(k==='p'||k==='Escape') setPause(!F.paused);
  if(nav.indexOf(k)>=0) e.preventDefault();
});
window.addEventListener('keyup',e=>{ const k=e.key.length===1?e.key.toLowerCase():e.key; keys[k]=false; });
window.addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; });
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&(F.state==='play'||F.state==='intro')) setPause(true); });
['gesturestart','dblclick'].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
document.addEventListener('contextmenu',e=>e.preventDefault());
function setPause(p){
  if(F.state==='sel'||F.state==='over') return;
  F.paused=p; $('pauseOv').hidden=!p;
  if(p){ stickEnd(); try{ $('resumeBtn').focus({preventScroll:true}); }catch(e){} }
}
$('btnPause').addEventListener('click',()=>{ unlock(); setPause(!F.paused); });
$('resumeBtn').addEventListener('click',()=>setPause(false));
$('quitBtn').addEventListener('click',()=>{ F.paused=false; showSelect(); });
$('btnSnd').addEventListener('click',()=>{ unlock(); muted=!muted; $('btnSnd').setAttribute('aria-pressed',String(!muted)); $('btnSnd').setAttribute('aria-label',muted?'Sound off':'Sound on'); });
$('rematchBtn').addEventListener('click',()=>{ unlock(); startMatch(save.fighter,save.mode,save.diff,false); });
$('changeBtn').addEventListener('click',()=>showSelect());

/* ---------- select screen ---------- */
const stat=(v,a,b)=>Math.round(clamp((v-a)/(b-a),.08,1)*100)+'%';
function showPreview(i){
  const d=FIGHTERS[i]; portrait($('prevCv'),i,62);
  $('pName').textContent=d.name; $('pTag').textContent=d.tag; $('pSp').textContent=d.sp;
  $('sSpd').style.width=stat(d.spd,1.0,2.3); $('sPow').style.width=stat(d.pow,.7,1.4); $('sWgt').style.width=stat(d.wt,.6,1.4); $('sJmp').style.width=stat(d.jump,4.6,5.8);
}
const grid=$('grid');
FIGHTERS.forEach((d,i)=>{
  const b=document.createElement('button'); b.type='button'; b.className='card'; b.setAttribute('aria-pressed','false'); b.setAttribute('aria-label',d.name);
  const c=document.createElement('canvas'); c.width=96; c.height=104; b.appendChild(c);
  const s=document.createElement('span'); s.textContent=d.name; b.appendChild(s);
  b.addEventListener('click',()=>{ unlock(); pickFighter(i); SFX.pick(); });
  grid.appendChild(b); portrait(c,i,62);
});
function pickFighter(i){
  save.fighter=i; persist(); showPreview(i);
  [].forEach.call(grid.children,(b,j)=>b.setAttribute('aria-pressed',String(j===i)));
}
function syncOpts(){
  [].forEach.call($('mode').children,b=>b.setAttribute('aria-pressed',String(+b.dataset.m===save.mode)));
  [].forEach.call($('lvl').children,b=>b.setAttribute('aria-pressed',String(+b.dataset.l===save.diff)));
}
[].forEach.call($('mode').children,b=>b.addEventListener('click',()=>{ unlock(); save.mode=+b.dataset.m; persist(); syncOpts(); SFX.pick(); }));
[].forEach.call($('lvl').children,b=>b.addEventListener('click',()=>{ unlock(); save.diff=+b.dataset.l; persist(); syncOpts(); SFX.pick(); }));
function showSelect(){
  F.state='sel'; F.paused=false; stickEnd();
  $('sel').hidden=false; $('fight').hidden=true; syncOpts();
  $('rec').textContent='W '+save.wins+'  L '+save.losses;
}
function showFight(){ $('sel').hidden=true; $('fight').hidden=false; requestAnimationFrame(resize); }
$('fightBtn').addEventListener('click',()=>{ unlock(); SFX.go(); showFight(); resize(); startMatch(save.fighter,save.mode,save.diff,false); });

/* ---------- loop ---------- */
let last=performance.now(), acc=0, manual=false;
function frame(now){
  const dt=Math.min(.1,(now-last)/1000||0); last=now;
  if(!manual){ acc+=dt; let n=0; while(acc>=STEP&&n<5){ update(); acc-=STEP; n++; } if(n===5) acc=0; }
  draw();
  requestAnimationFrame(frame);
}
buildFar();
if(!(save.fighter>=0&&save.fighter<FIGHTERS.length)) save.fighter=0;
if(!(save.diff>=0&&save.diff<=2)) save.diff=1;
if(!(save.mode===0||save.mode===1)) save.mode=0;
pickFighter(save.fighter); syncOpts(); showSelect();
if(location.search.indexOf('rrtest')>=0){
  manual=true;
  window.__rr={F:F,FIGHTERS:FIGHTERS,update:update,startMatch:startMatch,showFight:showFight,resize:resize,draw:draw,press:press,tc:tc,keys:keys,support:support,nearPlats:nearPlats};
}
requestAnimationFrame(frame);
})();
</script>
